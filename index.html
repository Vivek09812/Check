<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() { emailjs.init("PvSgTahKrHC7mchSK"); })();

    <style>
        :root {
            --bg-color: #09090b;
            --card-bg: rgba(24, 24, 27, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #10b981; 
            --primary-hover: #059669;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(39, 39, 42, 0.6);
            --glow: 0 0 25px rgba(16, 185, 129, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(16, 185, 129, 0.12), transparent 45%),
                              radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.06), transparent 45%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .contact-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h2 {
            font-size: 32px; font-weight: 700;
            background: linear-gradient(to right, #10b981, #34d399);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .header p { color: var(--text-muted); font-size: 14px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; gap: 0; } }

        .form-group { position: relative; margin-bottom: 24px; }
        .form-control {
            width: 100%; padding: 16px; background: var(--input-bg);
            border: 1px solid var(--border-color); border-radius: 12px;
            color: var(--text-main); font-size: 15px; outline: none; transition: all 0.3s ease;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: var(--glow); background: rgba(39, 39, 42, 0.85); }
        .form-control::placeholder { color: transparent; }
        
        .floating-label {
            position: absolute; left: 16px; top: 16px; color: var(--text-muted);
            font-size: 15px; pointer-events: none; transition: 0.3s ease all;
        }
        .form-control:focus ~ .floating-label, .form-control:not(:placeholder-shown) ~ .floating-label {
            top: -10px; left: 12px; font-size: 12px; background: #09090b; padding: 0 6px;
            color: var(--primary); border-radius: 4px;
        }

        /* Action Hub Buttons */
        .action-hub { display: flex; gap: 10px; margin-bottom: 15px; }
        .action-btn {
            flex: 1; padding: 12px 10px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color); border-radius: 12px;
            color: var(--text-main); font-size: 13px; cursor: pointer;
            transition: all 0.3s; display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .action-btn:hover { background: rgba(16, 185, 129, 0.1); border-color: var(--primary); }
        .action-btn.active-record { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); animation: pulse 1.5s infinite; }
        .action-btn svg { width: 24px; height: 24px; fill: var(--primary); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        .file-input { display: none; }

        /* Media Previews */
        .media-preview-container {
            display: none; flex-direction: column; align-items: center;
            background: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 15px; margin-bottom: 24px;
        }
        #camera-video { width: 100%; max-width: 300px; border-radius: 8px; margin-bottom: 10px; background: #000; }
        #camera-canvas { display: none; }
        #audio-playback { width: 100%; margin-top: 10px; outline: none; }
        
        .capture-btn {
            background: var(--primary); color: #000; border: none; padding: 8px 20px;
            border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px;
        }
        .capture-btn.stop { background: var(--danger); color: #fff; }
        
        .file-list { margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 8px; }
        .file-chip { background: rgba(16, 185, 129, 0.1); color: var(--primary); padding: 6px 12px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(16, 185, 129, 0.3); }

        .submit-btn {
            width: 100%; padding: 16px; background: var(--primary); color: #000;
            border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; margin-bottom: 25px;
        }
        .submit-btn:hover:not(:disabled) { background: var(--primary-hover); box-shadow: var(--glow); transform: translateY(-2px); }

        /* Emoji Section */
        .emoji-section { border-top: 1px solid var(--border-color); padding-top: 20px; text-align: center; }
        .emoji-section p { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
        .emoji-btn-wrapper { display: flex; justify-content: center; gap: 12px; }
        .emoji-click-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color);
            font-size: 24px; padding: 10px 14px; border-radius: 12px; cursor: pointer; transition: 0.2s;
        }
        .emoji-click-btn:hover { background: rgba(16, 185, 129, 0.1); border-color: var(--primary); transform: scale(1.2); }
        .emoji-click-btn:active { transform: scale(0.9); }

        #status-msg { margin-top: 15px; text-align: center; font-size: 14px; font-weight: 500; white-space: pre-line; }
    </style>
</head>
<body>

    <div class="contact-card">
        <div class="header">
            <h2>Anonymous Hub</h2>
            <p>Send a message instantly. Identity is strictly optional.</p>
        </div>
        
        <form id="contactForm">
            <div class="form-row">
                <div class="form-group">
                    <input type="text" id="name" class="form-control" placeholder="Name" autocomplete="off">
                    <label class="floating-label">Alias / Name (Optional)</label>
                </div>
                <div class="form-group">
                    <input type="email" id="email" class="form-control" placeholder="Email" autocomplete="off">
                    <label class="floating-label">Email (Optional)</label>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <input type="tel" id="phone" class="form-control" placeholder="Phone" autocomplete="off">
                    <label class="floating-label">Phone (Optional)</label>
                </div>
                <div class="form-group">
                    <input type="text" id="social_handle" class="form-control" placeholder="Social" autocomplete="off">
                    <label class="floating-label">Insta/X Handle (Optional)</label>
                </div>
            </div>
            
            <div class="form-group">
                <textarea id="message" class="form-control" rows="4" placeholder="Message" required></textarea>
                <label class="floating-label">Secret Message *</label>
            </div>

            <div class="action-hub">
                <button type="button" class="action-btn" onclick="document.getElementById('media_upload').click()">
                    <span>📁</span> File/Media
                </button>
                <button type="button" class="action-btn" id="btn-camera" onclick="openCamera()">
                    <span>📷</span> Live Selfie
                </button>
                <button type="button" class="action-btn" id="btn-mic" onclick="toggleRecording()">
                    <span>🎙️</span> Voice Note
                </button>
                <input type="file" id="media_upload" class="file-input" multiple>
            </div>

            <div class="media-preview-container" id="camera-container">
                <p style="font-size:12px; color:var(--text-muted); margin-bottom:5px;">Live Camera</p>
                <video id="camera-video" autoplay playsinline></video>
                <canvas id="camera-canvas"></canvas>
                <img id="camera-preview" style="display:none; width:100%; max-width:300px; border-radius:8px; margin-bottom:10px;"/>
                <div>
                    <button type="button" class="capture-btn" id="snap-btn" onclick="takeSnapshot()">📸 Click Photo</button>
                    <button type="button" class="capture-btn" style="background:#4b5563;" onclick="closeCamera()">Cancel</button>
                </div>
            </div>

            <div class="media-preview-container" id="audio-container">
                <p id="audio-status" style="font-size:14px; color:var(--primary); font-weight:bold; margin-bottom:5px;">Recording...</p>
                <audio id="audio-playback" controls style="display:none;"></audio>
                <div style="margin-top:10px;">
                    <button type="button" class="capture-btn stop" id="stop-audio-btn" onclick="toggleRecording()">⏹️ Stop Recording</button>
                    <button type="button" class="capture-btn" style="background:#4b5563; display:none;" id="discard-audio-btn" onclick="discardAudio()">Discard</button>
                </div>
            </div>

            <div class="file-list" id="file-list"></div>
            
            <button type="submit" id="submitBtn" class="submit-btn">
                <span class="btn-text">Encrypt & Send Message</span>
            </button>
        </form>

        <div class="emoji-section">
            <p>Instant Anonymous Reaction (Spam-Friendly ⚡)</p>
            <div class="emoji-btn-wrapper">
                <button class="emoji-click-btn" onclick="sendEmojiReaction('🔥')">🔥</button>
                <button class="emoji-click-btn" onclick="sendEmojiReaction('🚀')">🚀</button>
                <button class="emoji-click-btn" onclick="sendEmojiReaction('👻')">👻</button>
                <button class="emoji-click-btn" onclick="sendEmojiReaction('❤️')">❤️</button>
                <button class="emoji-click-btn" onclick="sendEmojiReaction('💯')">💯</button>
            </div>
        </div>

        <div id="status-msg"></div>
    </div>

    <script>
        // File UI
        const fileInput = document.getElementById('media_upload');
        const fileList = document.getElementById('file-list');
        fileInput.addEventListener('change', updateUIList);

        let capturedImageBlob = null;
        let capturedAudioBlob = null;

        function updateUIList() {
            fileList.innerHTML = '';
            Array.from(fileInput.files).forEach(file => addChip(`📁 ${file.name}`));
            if(capturedImageBlob) addChip(`📷 Live_Selfie.jpg`);
            if(capturedAudioBlob) addChip(`🎙️ Voice_Note.webm`);
        }
        function addChip(text) {
            let chip = document.createElement('div');
            chip.className = 'file-chip';
            chip.innerText = text.length > 25 ? text.substring(0, 25) + '...' : text;
            fileList.appendChild(chip);
        }

        // Camera Logic
        let videoStream = null;
        async function openCamera() {
            const container = document.getElementById('camera-container');
            const video = document.getElementById('camera-video');
            const preview = document.getElementById('camera-preview');
            const snapBtn = document.getElementById('snap-btn');
            
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = videoStream;
                video.style.display = 'block';
                preview.style.display = 'none';
                snapBtn.style.display = 'inline-block';
                container.style.display = 'flex';
                capturedImageBlob = null;
                updateUIList();
            } catch (err) {
                alert("Camera access denied (Requires HTTPS).");
            }
        }
        function takeSnapshot() {
            const video = document.getElementById('camera-video');
            const canvas = document.getElementById('camera-canvas');
            const preview = document.getElementById('camera-preview');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            canvas.toBlob(blob => {
                capturedImageBlob = blob;
                preview.src = URL.createObjectURL(blob);
                video.style.display = 'none'; preview.style.display = 'block';
                document.getElementById('snap-btn').style.display = 'none';
                updateUIList();
                videoStream.getTracks().forEach(t => t.stop());
            }, 'image/jpeg', 0.8);
        }
        function closeCamera() {
            document.getElementById('camera-container').style.display = 'none';
            if(videoStream) videoStream.getTracks().forEach(t => t.stop());
            capturedImageBlob = null; updateUIList();
        }

        // Audio Logic
        let mediaRecorder; let audioChunks = []; let isRecording = false;
        async function toggleRecording() {
            const btnMic = document.getElementById('btn-mic');
            const container = document.getElementById('audio-container');
            const statusTxt = document.getElementById('audio-status');
            const stopBtn = document.getElementById('stop-audio-btn');
            const discardBtn = document.getElementById('discard-audio-btn');
            const playback = document.getElementById('audio-playback');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        capturedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        playback.src = URL.createObjectURL(capturedAudioBlob);
                        playback.style.display = 'block'; statusTxt.textContent = "Voice Note Ready!";
                        stopBtn.style.display = 'none'; discardBtn.style.display = 'inline-block';
                        updateUIList();
                    };
                    mediaRecorder.start(); isRecording = true; btnMic.classList.add('active-record');
                    container.style.display = 'flex'; playback.style.display = 'none';
                    stopBtn.style.display = 'inline-block'; discardBtn.style.display = 'none';
                    statusTxt.textContent = "🎙️ Recording... Speak now!";
                } catch (err) { alert("Microphone access denied (Requires HTTPS)."); }
            } else {
                mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(t => t.stop());
                isRecording = false; btnMic.classList.remove('active-record');
            }
        }
        function discardAudio() {
            document.getElementById('audio-container').style.display = 'none';
            capturedAudioBlob = null; updateUIList();
        }

        // --- API INTEGRATION KEYS ---
        const botToken = '8921204325:AAFWEfsmBdtmDFAT47-ShRcLfVeSz25XwuY';
        const chatId = '@RADHE_EARNERSS'; 
        const serviceID = 'service_yy3pu1f';
        const templateID = 'template_h793teg';

        // Emoji Logic
        async function sendEmojiReaction(emoji) {
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: `⚡ <b>Reaction:</b> ${emoji}`, parse_mode: 'HTML' })
            });
        }

        // --- MAIN FORM LOGIC (Smart Text & Captions) ---
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            const status = document.getElementById('status-msg');
            const btn = document.getElementById('submitBtn');
            const btnText = document.querySelector('.btn-text');

            btn.disabled = true;
            btnText.textContent = "Encrypting Data...";
            status.textContent = "Connecting to Secure API Gateway...";
            status.style.color = "var(--text-muted)";
            
            // Collect Form Values
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const social = document.getElementById('social_handle').value.trim();
            const msg = document.getElementById('message').value.trim();

            try {
                // 1. SMART MESSAGE BUILDER
                let tgMessage = "";
                if (name || email || phone || social) {
                    tgMessage += `🕵️‍♂️ <b>DROP DETAILS</b> 🕵️‍♂️\n\n`;
                    if (name) tgMessage += `👤 <b>Identity:</b> ${name}\n`;
                    if (email) tgMessage += `📧 <b>Email:</b> ${email}\n`;
                    if (phone) tgMessage += `📱 <b>Phone:</b> ${phone}\n`;
                    if (social) tgMessage += `📸 <b>Social:</b> ${social}\n`;
                    tgMessage += `\n📝 <b>Message:</b>\n<i>" ${msg} "</i>`;
                } else {
                    // If everything is blank, JUST send the raw message!
                    tgMessage = `<i>${msg}</i>`;
                }

                // Check for media
                const totalMediaFiles = fileInput.files.length + (capturedImageBlob ? 1 : 0) + (capturedAudioBlob ? 1 : 0);
                
                // Telegram allows max 1024 chars in a caption. If message is small enough, attach as caption.
                const attachAsCaption = totalMediaFiles > 0 && tgMessage.length < 1000;
                let textAlreadySent = false;

                // 2. SEND STANDALONE TEXT (if no media OR message is too long for caption)
                if (!attachAsCaption) {
                    await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: chatId, text: tgMessage, parse_mode: 'HTML' })
